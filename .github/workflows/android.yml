name: Android CI/CD

on:
  push:
    branches: [ "main" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version/tag, e.g. v0.1.0-alpha.1'
        required: true
        default: 'v0.1.0-alpha.1'
      prerelease:
        description: 'Mark this release as prerelease'
        required: true
        type: boolean
        default: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: set up JDK 22
      uses: actions/setup-java@v4
      with:
        java-version: '22'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Decode Keystore
      run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > release.jks

    - name: Build with Gradle
      run: ./gradlew assembleRelease
      env:
        KEYSTORE_PATH: ${{ github.workspace }}/release.jks
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-release
        path: app/build/outputs/apk/release/app-release.apk

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v4

    - name: Resolve release metadata
      id: release_meta
      shell: bash
      run: |
        if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
          TAG_NAME="${{ inputs.version }}"
          PRERELEASE="${{ inputs.prerelease }}"
        else
          TAG_NAME="${GITHUB_REF_NAME}"
          if [[ "${TAG_NAME}" == *"-alpha"* ]] || [[ "${TAG_NAME}" == *"-beta"* ]] || [[ "${TAG_NAME}" == *"-rc"* ]]; then
            PRERELEASE="true"
          else
            PRERELEASE="false"
          fi
        fi

        if [[ "${TAG_NAME}" != v* ]]; then
          TAG_NAME="v${TAG_NAME}"
        fi

        echo "tag_name=${TAG_NAME}" >> "$GITHUB_OUTPUT"
        echo "prerelease=${PRERELEASE}" >> "$GITHUB_OUTPUT"

    - name: Download APK
      uses: actions/download-artifact@v4
      with:
        name: app-release

    - name: Create Release
      uses: ncipollo/release-action@v1
      with:
        tag: ${{ steps.release_meta.outputs.tag_name }}
        name: ${{ steps.release_meta.outputs.tag_name }}
        prerelease: ${{ steps.release_meta.outputs.prerelease }}
        artifacts: "app-release.apk"
        token: ${{ secrets.GITHUB_TOKEN }}
        generateReleaseNotes: true
